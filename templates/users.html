{% extends "base.html" %}
{% block title %}Users · MotoQR{% endblock %}
{% block content %}
<div class="section-bar"><h2>REGISTERED USERS</h2></div>
<p class="subtitle">All accounts in the system</p>

<div class="table-wrap">
  <table>
    <thead><tr><th>Username</th><th>Role</th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.username }}</td>
        <td>{{ u.role }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
