<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register · MotoQR</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="color:var(--green);font-size:1.4rem;margin-bottom:6px">✦</div>
      <h1>CREATE ACCOUNT</h1>
      <p class="subtitle">Register a new client profile</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <form method="post">
        <div class="field">
          <label>USERNAME</label>
          <input name="username" required />
        </div>
        <div class="field">
          <label>PASSWORD</label>
          <input type="password" name="password" required />
        </div>
        <button class="btn green filled block" type="submit" style="margin-top:12px">REGISTER ✓</button>
      </form>
      <p style="margin-top:18px;text-align:center;color:var(--muted);font-size:0.9rem">
        <a href="{{ url_for('login') }}">← Back to login</a>
      </p>
    </div>
  </div>
</body>
</html>
